<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Decision Kit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#121733">
<style>
  :root {
    --bg: #121733;
    --bg2: #1a2040;
    --panel: #1c2344;
    --line: #313a66;
    --text: #f3eee2;
    --muted: #b9bdd2;
    --lamp: #f4bd6a;
    --lamp-soft: rgba(244, 189, 106, .16);
    --fog: #9cc0e6;
    --tug: #d2a9ea;
    --dread: #f0a18c;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(900px 520px at 50% -8%, #232c5c 0%, var(--bg) 62%) fixed;
    color: var(--text);
    font-family: var(--sans);
    font-size: 18px;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 20px 120px; }
  header.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .brand { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--lamp); }
  @media (max-width: 480px) { header.top { flex-direction: column; align-items: flex-start; gap: 0; } .nav { margin-left: -6px; } }
  .nav button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; padding: 8px 6px; cursor: pointer; }
  .nav button:hover { color: var(--text); }

  .progress { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; margin-bottom: 26px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--lamp); box-shadow: 0 0 8px rgba(244,189,106,.6); }

  .screen { animation: rise .45s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none; } * { transition: none !important; } }

  h1, h2 { font-family: var(--serif); font-weight: 500; margin: 0 0 14px; line-height: 1.22; }
  h1 { font-size: clamp(34px, 8vw, 44px); }
  h2 { font-size: clamp(26px, 6vw, 32px); }
  h2.big { font-size: clamp(28px, 7vw, 36px); margin: 8px 0 20px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .kicker { font-size: 14px; color: var(--lamp); margin: 0 0 8px; letter-spacing: .04em; }
  .small { font-size: 15px; color: var(--muted); }

  .hero { position: relative; height: 210px; margin: 0 -20px 18px; overflow: hidden; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .95;
    -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
  .hero .glow { position: absolute; left: 50%; top: 40%; width: 320px; height: 320px; transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(244,189,106,.28), transparent); animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .6; } }

  label.f { display: block; font-size: 15px; color: var(--muted); margin: 0 0 8px; }
  textarea, input[type=text], input[type=date] {
    width: 100%; background: var(--bg2); color: var(--text); border: 1.5px solid var(--line);
    border-radius: 16px; padding: 16px; font: inherit; font-size: 18px;
  }
  textarea { min-height: 96px; resize: vertical; }
  textarea:focus, input:focus { outline: none; border-color: var(--lamp); box-shadow: 0 0 0 4px var(--lamp-soft); }
  ::placeholder { color: #7f85a6; }
  .gap { height: 18px; }

  .opt {
    display: block; width: 100%; text-align: left; background: var(--bg2); color: var(--text);
    border: 1.5px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 12px;
    font: inherit; font-size: 18px; cursor: pointer; transition: border-color .2s, background .2s;
  }
  .opt:hover { border-color: var(--lamp); }
  .opt.sel { border-color: var(--lamp); background: #272f5a; }
  .chip {
    display: inline-block; background: transparent; color: var(--text); border: 1.5px solid var(--line);
    border-radius: 999px; padding: 10px 16px; margin: 0 8px 10px 0; font: inherit; font-size: 16px; cursor: pointer;
  }
  .chip:hover { border-color: var(--lamp); }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 40%); z-index: 5; }
  .bar .in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .btn {
    width: 100%; background: var(--lamp); color: #231903; border: 0; border-radius: 999px;
    padding: 17px 26px; font: inherit; font-size: 18px; font-weight: 600; cursor: pointer;
    box-shadow: 0 6px 28px rgba(244,189,106,.25);
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); box-shadow: none; font-weight: 500; }
  .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 15px; padding: 8px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .link:hover { color: var(--text); }
  .inline-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }

  .tag { display: inline-block; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1.5px solid currentColor; }
  .t-fog { color: var(--fog); } .t-tug { color: var(--tug); } .t-dread { color: var(--dread); }
  .ex { background: var(--bg2); border-radius: 16px; padding: 16px; margin: 0 0 14px; font-size: 17px; color: var(--text); }
  .ex b { display: block; color: var(--lamp); font-weight: 600; font-size: 14px; margin-bottom: 4px; letter-spacing: .04em; }
  details { margin: 0 0 18px; color: var(--muted); font-size: 16px; }
  summary { cursor: pointer; padding: 6px 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin-bottom: 14px; }
  .lock { opacity: .7; }
  .fill { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .fill span { color: var(--muted); white-space: nowrap; font-size: 16px; }

  .dcard { background: #f6f1e4; color: #231d10; border-radius: 20px; padding: 24px; margin-bottom: 20px; }
  .dcard h3 { margin: 0 0 4px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8a5a10; font-family: var(--sans); }
  .dcard p { margin: 0 0 16px; white-space: pre-wrap; font-size: 17px; }
  .dcard .big { font-size: 20px; font-family: var(--serif); }
  .dcard .bname { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #8a5a10; margin-bottom: 14px; }
  footer { margin-top: 36px; font-size: 13px; color: #8d92b2; text-align: center; }

  @media print {
    body { background: #fff; }
    .noprint, .bar, header.top, footer { display: none !important; }
    .dcard { border: 1px solid #999; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top noprint">
    <div class="brand">Midnight Decision Kit</div>
    <div class="nav">
      <button id="homeBtn">My decisions</button>
      <button id="libBtn">Cards</button>
      <button id="resetBtn">Start over</button>
    </div>
  </header>
  <div id="app"></div>
  <footer class="noprint">A thinking tool, not medical, legal, financial or therapeutic advice. It never tells you what to choose.</footer>
</div>
<div class="bar noprint" id="bar" hidden><div class="in" id="barIn"></div></div>

<script src="content.js"></script>
<script>
const STEPS = ["Name your choice", "Find your stuck type", "See it differently", "Take one small step"];
const KEY = "midnightRoom.v1", HKEY = "midnightRoom.history.v1";
const blank = () => ({ id:null, step:0, qi:0, fi:0, pick:false, a:"", b:"", quiz:[null,null,null], type:null, type2:null,
  slots:[0,1], notes:{}, action:"", when:"", ifx:"", choose:"", outcomeNote:"", outcomeChoice:"" });
let S = load();
const app = document.getElementById("app"), bar = document.getElementById("bar"), barIn = document.getElementById("barIn");

function load() { try { const r = localStorage.getItem(KEY); if (r) return Object.assign(blank(), JSON.parse(r)); } catch (e) {} return blank(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function loadHist() { try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) { return []; } }
function upsertHist() {
  if (!S.id) return;
  const h = loadHist().filter(x => x.id !== S.id); h.unshift(Object.assign({}, S, { step: 5 }));
  try { localStorage.setItem(HKEY, JSON.stringify(h)); } catch (e) {}
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const nice = s => new Date(s + "T00:00:00").toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });

function allOfType(t) { return CARDS.map((c, i) => ({ c, i })).filter(x => x.c.t === t); }
function typeCards(t) { return allOfType(t).filter(x => !x.c.locked); }
function scores() {
  const n = { fog:0, tug:0, dread:0 };
  S.quiz.forEach((v, i) => { if (v !== null) n[QUIZ[i].a[v][1]]++; });
  const first = S.quiz[0] === null ? null : QUIZ[0].a[S.quiz[0]][1];
  return { n, order: Object.keys(n).sort((x, y) => n[y] - n[x] || (y === first) - (x === first)) };
}
function secondary(main) { const { n, order } = scores(); const k = order.find(x => x !== main); return n[k] > 0 ? k : null; }
function diagnose() { S.type = scores().order[0]; S.type2 = secondary(S.type); }
function status(d) {
  if (d.outcomeChoice) return "Checked in: " + (d.outcomeChoice === "A" ? "chose A" : d.outcomeChoice === "B" ? "chose B" : "testing again");
  if (!d.when) return "Test not dated";
  return new Date(d.when + "T00:00:00") <= new Date() ? "Time to check in" : "Test by " + new Date(d.when + "T00:00:00").toLocaleDateString(undefined, { month:"short", day:"numeric" });
}

function go(step) {
  if (step === 1 && !S.id) S.id = String(Date.now());
  if (step === 2) { S.qi = S.quiz.every(x => x !== null) ? 3 : S.quiz.findIndex(x => x === null); S.pick = false; }
  if (step === 3) {
    const w0 = S.type, w1 = S.type2 || S.type;
    if (CARDS[S.slots[0]].t !== w0 || CARDS[S.slots[1]].t !== w1 || S.slots[0] === S.slots[1]) {
      const p0 = typeCards(w0).map(x => x.i), p1 = typeCards(w1).map(x => x.i).filter(i => i !== p0[0]);
      S.slots = [p0[0], p1[0]];
    }
    S.fi = 0;
  }
  if (step === 5) upsertHist();
  S.step = step; save(); render(); window.scrollTo(0, 0);
}

function setBar(primary, secondaryHtml) {
  if (!primary) { bar.hidden = true; return; }
  bar.hidden = false;
  barIn.innerHTML = primary + (secondaryHtml || "");
}
function progress() {
  if (S.step < 1 || S.step > 4) return "";
  return `<div class="progress noprint"><div class="dots">${[1,2,3,4].map(i => `<i class="${i <= S.step ? "on" : ""}"></i>`).join("")}</div>
    <span>Step ${S.step} of 4 · ${STEPS[S.step - 1]}</span></div>`;
}

function render() {
  const fn = [intro, fork, quiz, flip, nextDoor, result][S.step] || intro;
  setBar(null);
  app.innerHTML = progress() + `<div class="screen">` + fn() + `</div>`;
  const cta = document.getElementById("cta"); if (cta) cta.focus({ preventScroll: true });
}

function intro() {
  setBar(`<button class="btn" data-act="start">Begin</button>` +
    (S.id && S.step === 0 && S.a && !S.action.trim() ? "" : ""),
    S.id && S.step === 0 && S.a && !S.action.trim() ? `<button class="link" data-act="go" data-n="1">Continue where I left off</button>` : "");
  const h = loadHist();
  return `
    <div class="hero noprint"><div class="glow"></div><img src="hero.webp" alt="" onerror="this.remove()"></div>
    <h1>Stuck on a choice?<br>Let's take it slowly.</h1>
    <p class="lead">Four small steps, about 10 minutes. No wrong answers, and you don't have to decide tonight. You'll leave with one small thing to try.</p>
    ${DEMO ? `<p class="small">Free demo of the Midnight Decision Kit: 6 of the 12 cards.</p>` : ""}
    ${h.length ? `<h2 style="font-size:22px;margin:34px 0 12px">Your decisions</h2>` + h.map(d => `
      <button class="opt" data-act="open" data-id="${esc(d.id)}"><div>${esc(d.a)} <span class="small">or</span> ${esc(d.b)}</div>
      <div class="small">${esc(status(d))}</div></button>`).join("") : ""}`;
}

function fork() {
  const ok = S.a.trim() && S.b.trim();
  setBar(`<button class="btn" id="cta" data-act="go" data-n="2" ${ok ? "" : "disabled"}>Continue</button>`);
  return `
    <h2>What are you choosing between?</h2>
    <p class="lead">A few words each is plenty. Say them as things you'd actually do.</p>
    <label class="f" for="a">One option</label>
    <input type="text" id="a" data-bind="a" placeholder="e.g. Renew my lease" value="${esc(S.a)}" autocomplete="off">
    <div class="gap"></div>
    <label class="f" for="b">The other option</label>
    <input type="text" id="b" data-bind="b" placeholder="e.g. Move somewhere cheaper" value="${esc(S.b)}" autocomplete="off">`;
}

function quiz() {
  if (S.qi >= 3) {
    const t = S.type, t2 = S.type2;
    setBar(`<button class="btn" id="cta" data-act="go" data-n="3">Yes, that fits</button>`,
      `<button class="link" data-act="pick">Not quite</button>`);
    return `
      <p class="kicker">It sounds like</p>
      <h2 class="big t-${t}">${esc(TYPES[t].name)}</h2>
      <p class="lead">${esc(TYPES[t].blurb)}</p>
      ${t2 ? `<p class="small">There may be a little <b class="t-${t2}">${esc(TYPES[t2].name)}</b> in it too. You'll get a card for each.</p>` : ""}
      ${S.pick ? `<div style="margin-top:20px"><p class="small">Pick the one that feels closest:</p>` +
        Object.keys(TYPES).filter(k => k !== t).map(k => `<button class="opt" data-act="type" data-k="${k}"><b class="t-${k}">${esc(TYPES[k].name)}</b><br><span class="small">${esc(TYPES[k].blurb)}</span></button>`).join("") + `</div>` : ""}`;
  }
  const q = QUIZ[S.qi];
  setBar(`<button class="link" data-act="qback">Back</button>`);
  return `
    <p class="kicker">Question ${S.qi + 1} of 3</p>
    <h2>${esc(q.q)}</h2>
    <p class="lead">Go with your gut. Tap the closest one.</p>
    ${q.a.map((o, oi) => `<button class="opt ${S.quiz[S.qi] === oi ? "sel" : ""}" data-act="opt" data-o="${oi}">${esc(o[0])}</button>`).join("")}`;
}

function flip() {
  const ci = S.slots[S.fi], c = CARDS[ci], last = S.fi === 1;
  const free = typeCards(c.t).some(x => !S.slots.includes(x.i));
  setBar(`<button class="btn" id="cta" data-act="${last ? "go" : "next"}" data-n="4">${last ? "Continue" : "Next card"}</button>`,
    `<button class="link" data-act="${S.fi ? "prev" : "go"}" data-n="2">Back</button>`);
  return `
    <p class="kicker">Card ${S.fi + 1} of 2 · <span class="t-${c.t}">${esc(TYPES[c.t].name)}</span></p>
    <h2 class="big">${esc(c.q)}</h2>
    <div class="ex"><b>TRY THIS</b>${esc(c.ex)}</div>
    <details><summary>Why this question?</summary><p style="margin:6px 0 0">${esc(c.why)}</p></details>
    <label class="f" for="n">Jot a few words if you like (optional)</label>
    <textarea id="n" data-note="${ci}" placeholder="Whatever comes up…">${esc(S.notes[ci] || "")}</textarea>
    ${free ? `<button class="link" data-act="swap" style="margin-top:6px">Show me a different one</button>` : ""}`;
}

function nextDoor() {
  const ideas = ["Talk to someone who's been there", "Try a small version for an hour", "Look up the one fact I'm missing", "Sleep on it and revisit"];
  setBar(`<button class="btn" id="cta" data-act="go" data-n="5" ${S.action.trim() ? "" : "disabled"}>Make my Decision Card</button>`,
    `<button class="link" data-act="go" data-n="3">Back</button>`);
  return `
    <h2>Pick one small thing to try.</h2>
    <p class="lead">Not the decision itself, just something that would teach you something in the next two days. Tap an idea or write your own.</p>
    <div>${ideas.map(t => `<button class="chip" data-act="chip" data-text="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <textarea id="action" data-bind="action" placeholder="My small test…">${esc(S.action)}</textarea>
    <div class="gap"></div>
    <label class="f">When?</label>
    <div>
      <button class="chip" data-act="day" data-d="1">Tomorrow</button>
      <button class="chip" data-act="day" data-d="2">In 2 days</button>
      <button class="chip" data-act="day" data-d="w">This weekend</button>
    </div>
    <input type="date" id="when" data-bind="when" value="${esc(S.when)}">
    <details style="margin-top:22px"><summary>Add a rule for what the result will mean (optional)</summary>
      <div class="fill" style="margin-top:10px"><span>If</span><input type="text" id="ifx" data-bind="ifx" placeholder="the commute is under 45 minutes" value="${esc(S.ifx)}"></div>
      <div class="fill"><span>then I choose</span><input type="text" id="choose" data-bind="choose" placeholder="Option B" value="${esc(S.choose)}"></div>
    </details>`;
}

function result() {
  setBar(`<button class="btn" data-act="print">Save as PDF or print</button>`,
    `<button class="link" data-act="copy">Copy as text</button> <span class="small" id="msg"></span>`);
  const t = S.type;
  const notes = S.slots.map(ci => ({ c: CARDS[ci], n: (S.notes[ci] || "").trim() })).filter(x => x.n);
  return `
    <p class="kicker noprint">All done</p>
    <h2 class="noprint">That's enough for tonight. You have a next step.</h2>
    <div class="dcard">
      <div class="bname">Midnight Decision Kit · Decision Card</div>
      <h3>The choice</h3><p class="big">${esc(S.a)}\n${esc(S.b)}</p>
      <h3>What's making it hard</h3><p>${esc(TYPES[t].name)}${S.type2 ? " (also " + esc(TYPES[S.type2].name) + ")" : ""}</p>
      ${notes.length ? `<h3>What I noticed</h3><p>${notes.map(x => `<b>${esc(x.c.title)}:</b> ${esc(x.n)}`).join("\n\n")}</p>` : ""}
      <h3>My small test</h3><p class="big">${esc(S.action)}${S.when ? "\nBy " + esc(nice(S.when)) : ""}</p>
      ${S.ifx.trim() ? `<h3>My rule</h3><p>If ${esc(S.ifx)}, then I choose ${esc(S.choose || "…")}. Otherwise I choose the other option.</p>` : ""}
      ${S.outcomeChoice ? `<h3>After the test</h3><p>${esc(S.outcomeNote)}${S.outcomeChoice === "again" ? "\nNeeds another test." : "\nChose " + S.outcomeChoice + "."}</p>` : ""}
    </div>
    <details class="noprint"><summary>After your test: come back and check in</summary>
      <div class="panel" style="margin-top:10px">
        <label class="f" for="onote">What did the test show?</label>
        <textarea id="onote" data-bind="outcomeNote" placeholder="A few words is fine…">${esc(S.outcomeNote)}</textarea>
        <div class="gap"></div>
        ${[["A","I'm choosing the first option"],["B","I'm choosing the second option"],["again","I need another test"]].map(o =>
          `<button class="opt ${S.outcomeChoice === o[0] ? "sel" : ""}" data-act="oc" data-v="${o[0]}">${o[1]}</button>`).join("")}
      </div>
    </details>
    <div class="inline-actions noprint"><button class="btn ghost" data-act="go" data-n="4">Edit my card</button>
      <button class="btn ghost" data-act="newdec">Start a new decision</button></div>`;
}

function plainText() {
  return ["MIDNIGHT DECISION KIT · DECISION CARD", "", "THE CHOICE", S.a, S.b, "",
    "WHAT'S MAKING IT HARD", TYPES[S.type].name + (S.type2 ? " (also " + TYPES[S.type2].name + ")" : ""), "",
    "MY SMALL TEST", S.action + (S.when ? " (by " + S.when + ")" : ""),
    ...(S.ifx.trim() ? ["", "MY RULE", `If ${S.ifx}, then I choose ${S.choose}. Otherwise I choose the other option.`] : [])].join("\n");
}

function library() {
  setBar(`<button class="btn" id="cta" data-act="home">Back</button>`);
  app.innerHTML = `<div class="screen"><h2>The cards</h2><p class="lead">Three kinds of stuck, four cards each. In a session you'll get two cards that match yours.</p>
    ${Object.keys(TYPES).map(t => `<h3 class="t-${t}" style="margin:26px 0 8px;font-weight:600">${esc(TYPES[t].name)}</h3><p class="small" style="margin-top:0">${esc(TYPES[t].blurb)}</p>` +
      allOfType(t).map(x => x.c.locked
        ? `<div class="panel lock"><b>🔒 ${esc(x.c.title)}</b><div class="small">In the full deck.${BUY_URL ? ` <a style="color:var(--lamp)" href="${esc(BUY_URL)}">Get the full deck</a>` : " Coming soon."}</div></div>`
        : `<div class="panel"><div class="small" style="color:var(--lamp)">${esc(x.c.title)}</div><div style="font-family:var(--serif);font-size:22px;line-height:1.3;margin:4px 0 8px">${esc(x.c.q)}</div><div class="small">${esc(x.c.ex)}</div></div>`).join("")).join("")}</div>`;
  window.scrollTo(0, 0);
}

// ---- events
const keep = fn => { const y = window.scrollY; fn(); render(); window.scrollTo(0, y); };
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case "start": S = blank(); go(1); break;
    case "go": go(Number(d.n)); break;
    case "home": S.step = 0; save(); render(); break;
    case "open": { const x = loadHist().find(h => h.id === d.id); if (x) { S = Object.assign(blank(), x); go(5); } break; }
    case "opt": S.quiz[S.qi] = Number(d.o); save(); render();
      setTimeout(() => { if (S.step !== 2) return; if (S.qi < 2) S.qi++; else { diagnose(); S.qi = 3; } save(); render(); window.scrollTo(0, 0); }, 260); break;
    case "qback": if (S.qi > 0 && S.qi < 3) { S.qi--; save(); render(); } else if (S.qi === 3) { S.qi = 2; save(); render(); } else go(1); break;
    case "pick": keep(() => { S.pick = !S.pick; }); break;
    case "type": S.type = d.k; S.type2 = secondary(S.type); S.pick = false; save(); render(); break;
    case "next": S.fi = 1; save(); render(); window.scrollTo(0, 0); break;
    case "prev": S.fi = 0; save(); render(); window.scrollTo(0, 0); break;
    case "swap": { const free = typeCards(CARDS[S.slots[S.fi]].t).map(x => x.i).filter(i => !S.slots.includes(i));
      if (free.length) { S.slots[S.fi] = free[0]; save(); render(); } break; }
    case "chip": { S.action = d.text; const t = document.getElementById("action"); t.value = d.text; save(); document.getElementById("cta").disabled = false; break; }
    case "day": { const n = new Date(); if (d.d === "w") { let k = (6 - n.getDay() + 7) % 7; n.setDate(n.getDate() + (k || 7)); } else n.setDate(n.getDate() + Number(d.d));
      S.when = iso(n); document.getElementById("when").value = S.when; save(); break; }
    case "oc": S.outcomeChoice = d.v; save(); upsertHist(); keep(() => {}); break;
    case "print": window.print(); break;
    case "copy": navigator.clipboard.writeText(plainText()).then(() => { document.getElementById("msg").textContent = "Copied."; }, () => { document.getElementById("msg").textContent = "Couldn't copy. Use print instead."; }); break;
    case "newdec": S = blank(); go(1); break;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.bind) {
    S[t.dataset.bind] = t.value; save();
    const cta = document.getElementById("cta");
    if (cta && S.step === 1) cta.disabled = !(S.a.trim() && S.b.trim());
    if (cta && S.step === 4) cta.disabled = !S.action.trim();
    if (t.dataset.bind === "outcomeNote") upsertHist();
  }
  if (t.dataset.note) { S.notes[t.dataset.note] = t.value; save(); }
});
document.getElementById("libBtn").addEventListener("click", library);
document.getElementById("homeBtn").addEventListener("click", () => { S.step = 0; save(); render(); });
document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Start over? Your current answers will be cleared.")) { S = blank(); save(); render(); }
});
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
render();
</script>
